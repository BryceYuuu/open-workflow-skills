[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-workflow-skills"
version = "2.0.0"
description = "A bilingual registry and local runtime for reusable AI workflow skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "BryceYuuu"}]
keywords = ["ai", "agents", "agent-skills", "automation", "workflow", "codex", "claude-code", "cursor"]

[project.scripts]
ows = "open_workflow_skills.cli:main"

[project.optional-dependencies]
media = ["Pillow>=10"]
spreadsheets = ["openpyxl>=3.1"]
all = ["Pillow>=10", "openpyxl>=3.1"]

[tool.setuptools]
packages = ["open_workflow_skills"]
