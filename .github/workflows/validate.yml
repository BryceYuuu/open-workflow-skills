name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install v2 runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . Pillow

      - name: Validate registry and smoke-test runnable skills
        run: ./scripts/test.sh
