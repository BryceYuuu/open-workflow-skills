name: Bootstrap repository contents

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and decode repository archive
        run: |
          cat .bootstrap/part-* > /tmp/open-workflow-skills.b64
          base64 -d /tmp/open-workflow-skills.b64 > /tmp/open-workflow-skills.tar.gz
          echo "bfb2fc8936d8c723b6498a307263aed4bdf625df6bebb62fec9daa72e5b28dc1  /tmp/open-workflow-skills.tar.gz" | sha256sum -c -
          tar -xzf /tmp/open-workflow-skills.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/validate.yml

      - name: Validate repository
        run: |
          python3 scripts/validate_registry.py
          ./scripts/test.sh

      - name: Commit expanded repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish 100 open workflow skills"
          git push
